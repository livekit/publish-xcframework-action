name: Publish XCFramework
description: >
  Publish an XCFramework zip to a hosting repo via draft release + PR.
  Copies caller-provided files (Package.swift, podspec, sources) as-is.

inputs:
  xcframework-zip:
    description: Path to the .xcframework.zip file
    required: true
  version:
    description: Version tag (e.g., 0.0.5)
    required: true
  hosting-repo:
    description: Target repo in owner/name format
    required: true
  files:
    description: >
      Newline-separated source:destination pairs.
      Sources are path patterns; a destination ending in '/' is a directory and
      every match keeps its basename, otherwise it names a single file. A source
      matching nothing fails the action. Lines starting with '#' are ignored.
      Files are copied verbatim — render any templates before calling this action.
    required: true
  token:
    description: GitHub PAT with repo access to hosting repo
    required: true
  branch-prefix:
    description: Prefix for release branch name
    required: false
    default: 'release/'
  commit-author-name:
    description: Git author name
    required: false
    default: 'github-actions[bot]'
  commit-author-email:
    description: Git author email
    required: false
    default: '41898282+github-actions[bot]@users.noreply.github.com'
  pr-body:
    description: Extra text appended to the PR body
    required: false
    default: ''
    # The default PR body links to the source repo's workflow run, lists assets
    # in a table, and warns to merge before publishing the draft release.
  release-body:
    description: Extra text appended to the draft release notes
    required: false
    default: ''
    # The default release body links to the source repo's workflow run and
    # lists assets in a table.

outputs:
  checksum:
    description: SHA256 of the xcframework zip
    value: ${{ steps.checksum.outputs.checksum }}
  release-id:
    description: GitHub release ID
    value: ${{ steps.release.outputs.release-id }}
  pr-number:
    description: PR number
    value: ${{ steps.pr.outputs.pr-number }}
  pr-url:
    description: PR URL
    value: ${{ steps.pr.outputs.pr-url }}
  branch:
    description: Created branch name
    value: ${{ steps.vars.outputs.branch }}

runs:
  using: composite
  steps:
    # Step 1: Compute SHA256 checksum
    - name: Compute checksum
      id: checksum
      shell: bash
      run: |
        CHECKSUM=$(shasum -a 256 "${{ inputs.xcframework-zip }}" | awk '{print $1}')
        echo "checksum=${CHECKSUM}" >> "$GITHUB_OUTPUT"
        echo "Checksum: ${CHECKSUM}"

    # Step 2: Derive variables
    - name: Derive variables
      id: vars
      shell: bash
      run: |
        ASSET_NAME=$(basename "${{ inputs.xcframework-zip }}")
        BRANCH="${{ inputs.branch-prefix }}${{ inputs.version }}"
        echo "asset-name=${ASSET_NAME}" >> "$GITHUB_OUTPUT"
        echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
        echo "Asset name: ${ASSET_NAME}"
        echo "Branch: ${BRANCH}"

    # Step 3: Refuse to overwrite an existing release (draft or published).
    # Must run before any destructive action (branch deletion, etc.).
    # To retry a failed draft publish, delete the draft release first:
    #   gh release delete <version> --repo <hosting-repo> --cleanup-tag
    - name: Guard against overwrite
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        VERSION="${{ inputs.version }}"
        REPO="${{ inputs.hosting-repo }}"
        if gh release view "${VERSION}" --repo "${REPO}" >/dev/null 2>&1; then
          echo "::error::Release ${VERSION} already exists on ${REPO}. Refusing to overwrite. To retry a failed draft, delete the draft release first."
          exit 1
        fi

    # Step 4: Clone the hosting repo
    - name: Clone hosting repo
      shell: bash
      env:
        TOKEN: ${{ inputs.token }}
      run: |
        echo "::add-mask::${TOKEN}"
        git clone "https://x-access-token:${TOKEN}@github.com/${{ inputs.hosting-repo }}.git" \
          "${{ runner.temp }}/hosting-repo"

    # Step 5: Create release branch
    - name: Create release branch
      shell: bash
      working-directory: ${{ runner.temp }}/hosting-repo
      run: |
        git config user.name "${{ inputs.commit-author-name }}"
        git config user.email "${{ inputs.commit-author-email }}"

        DEFAULT_BRANCH=$(git symbolic-ref refs/remotes/origin/HEAD | sed 's@^refs/remotes/origin/@@')
        echo "Default branch: ${DEFAULT_BRANCH}"
        echo "DEFAULT_BRANCH=${DEFAULT_BRANCH}" >> "$GITHUB_ENV"

        BRANCH="${{ steps.vars.outputs.branch }}"

        # Delete remote branch if it exists (idempotency for retries)
        if git ls-remote --exit-code --heads origin "${BRANCH}" >/dev/null 2>&1; then
          echo "Branch ${BRANCH} already exists on remote, deleting for retry..."
          git push origin --delete "${BRANCH}"
        fi

        git checkout -b "${BRANCH}"

    # Step 6: Copy files
    - name: Copy files
      shell: bash
      env:
        FILES: ${{ inputs.files }}
      run: |
        set -euo pipefail
        HOSTING_REPO="${{ runner.temp }}/hosting-repo"

        # Heredoc instead of pipe to keep the loop in the parent shell so a
        # failure aborts the whole step (echo|while puts the body in a subshell
        # and a failure there is easy to swallow). Each source file is checked
        # explicitly so a missing file produces a clear error rather than a
        # partial release.
        copy_one() {
          echo "Copying: $1 -> $2"
          mkdir -p "$(dirname "${HOSTING_REPO}/$2")"
          cp "$1" "${HOSTING_REPO}/$2"
        }

        while IFS= read -r line; do
          [ -z "${line}" ] && continue
          # Comments, so a long list can be annotated without the text being
          # mistaken for a path.
          case "${line}" in \#*) continue ;; esac

          SRC="${line%%:*}"
          DST="${line#*:}"

          SRC=$(echo "${SRC}" | xargs)
          DST=$(echo "${DST}" | xargs)

          # Sources are patterns, as in actions/upload-artifact and
          # softprops/action-gh-release: a literal path is simply a pattern that
          # matches only itself. Literals are resolved first so a name containing
          # a glob metacharacter, or a space, keeps working.
          if [ -f "${SRC}" ]; then
            matches=("${SRC}")
          else
            matches=()
            for match in ${SRC}; do
              [ -f "${match}" ] && matches[${#matches[@]}]="${match}"
            done
          fi

          # Matching nothing is an error for the same reason a missing file is:
          # it would publish a silently incomplete release.
          if [ ${#matches[@]} -eq 0 ]; then
            echo "::error::No files match source: ${SRC}"
            exit 1
          fi

          case "${DST}" in
            */)
              # Directory destination: every match keeps its own basename. Use this
              # for sets whose members aren't known up front, such as one generated
              # source file per module.
              for match in "${matches[@]}"; do
                copy_one "${match}" "${DST}${match##*/}"
              done
              ;;
            *)
              # A destination naming a file can only take one.
              if [ ${#matches[@]} -ne 1 ]; then
                echo "::error::${#matches[@]} files match '${SRC}' but '${DST}' names a single file; end the destination with '/' to copy them into a directory"
                exit 1
              fi
              copy_one "${matches[0]}" "${DST}"
              ;;
          esac
        done <<< "${FILES}"

    # Step 7: Commit and push
    - name: Commit and push
      shell: bash
      working-directory: ${{ runner.temp }}/hosting-repo
      run: |
        BRANCH="${{ steps.vars.outputs.branch }}"

        git add -A

        if git diff --cached --quiet; then
          echo "::error::No changes detected after copying files"
          exit 1
        fi

        git commit -m "v${{ inputs.version }}"
        git push -u origin "${BRANCH}"

    # Step 8: Derive body templates shared by PR and release
    - name: Build body templates
      id: body
      shell: bash
      env:
        EXTRA_PR_BODY: ${{ inputs.pr-body }}
        EXTRA_RELEASE_BODY: ${{ inputs.release-body }}
      run: |
        # github.repository is the calling workflow's repo (the source), not
        # this action's repo — even when invoked as a composite action.
        SOURCE_REPO="${{ github.repository }}"
        SHA="${{ github.sha }}"
        SHORT_SHA="${SHA:0:7}"
        COMMIT_URL="${{ github.server_url }}/${SOURCE_REPO}/commit/${SHA}"

        SOURCE_LINK="Built by [\`${SOURCE_REPO}@${SHORT_SHA}\`](${COMMIT_URL})"

        RELEASE_BODY="${SOURCE_LINK}"
        if [ -n "${EXTRA_RELEASE_BODY}" ]; then
          RELEASE_BODY="${RELEASE_BODY}

        ${EXTRA_RELEASE_BODY}"
        fi

        PR_BODY="${SOURCE_LINK}

        > [!IMPORTANT]
        > Merge this PR first, then publish the draft release."
        if [ -n "${EXTRA_PR_BODY}" ]; then
          PR_BODY="${PR_BODY}

        ${EXTRA_PR_BODY}"
        fi

        {
          echo "release-body<<__EOF__"
          echo "${RELEASE_BODY}"
          echo "__EOF__"
          echo "pr-body<<__EOF__"
          echo "${PR_BODY}"
          echo "__EOF__"
        } >> "$GITHUB_OUTPUT"

    # Step 9: Create draft release
    - name: Create draft release
      id: release
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        RELEASE_BODY: ${{ steps.body.outputs.release-body }}
      run: |
        ASSET_PATH="${{ inputs.xcframework-zip }}"
        ASSET_NAME="${{ steps.vars.outputs.asset-name }}"
        VERSION="${{ inputs.version }}"
        REPO="${{ inputs.hosting-repo }}"

        RELEASE_URL=$(gh release create "${VERSION}" \
          "${ASSET_PATH}#${ASSET_NAME}" \
          --repo "${REPO}" \
          --draft \
          --title "${VERSION}" \
          --notes "${RELEASE_BODY}")

        RELEASE_ID=$(gh release view "${VERSION}" --repo "${REPO}" --json databaseId --jq '.databaseId')
        echo "release-id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"
        echo "Release URL: ${RELEASE_URL}"

    # Step 10: Open PR
    - name: Open PR
      id: pr
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        PR_BODY: ${{ steps.body.outputs.pr-body }}
      run: |
        VERSION="${{ inputs.version }}"
        BRANCH="${{ steps.vars.outputs.branch }}"
        REPO="${{ inputs.hosting-repo }}"

        PR_URL=$(gh pr create \
          --repo "${REPO}" \
          --base "${DEFAULT_BRANCH}" \
          --head "${BRANCH}" \
          --title "v${VERSION}" \
          --body "${PR_BODY}")

        PR_NUMBER=$(gh pr view "${BRANCH}" --repo "${REPO}" --json number --jq '.number')
        echo "pr-number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
        echo "pr-url=${PR_URL}" >> "$GITHUB_OUTPUT"
        echo "PR: ${PR_URL}"
